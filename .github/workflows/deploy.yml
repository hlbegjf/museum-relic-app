name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: npm ci
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npmci.log || {
            {
              echo "## npm ci FAILED"
              echo '```'
              tail -40 /tmp/npmci.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: Diagnose environment
        run: |
          {
            echo "## CI Environment Diagnostics"
            echo "- node: $(node -v)"
            echo "- npm: $(npm -v)"
            echo "- tsc: $(./node_modules/.bin/tsc --version)"
            echo "- typescript package: $(node -p "require('typescript/package.json').version" 2>&1)"
            echo "- node_modules/react: $(test -d node_modules/react && echo EXISTS || echo MISSING)"
            echo "- node_modules/@types/react: $(test -d node_modules/@types/react && echo EXISTS || echo MISSING)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: npm run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log || {
            {
              echo "## npm run build FAILED"
              echo '```'
              tail -60 /tmp/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
